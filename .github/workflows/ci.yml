name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs, not tags:
      # a tag can be moved to point at malicious code, a SHA cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential qemu-system-x86 xorriso

      - name: Build release ISO
        run: make -j"$(nproc)" iso

      - name: Boot self-tests in QEMU
        run: make test

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-log
          path: build/test/selftest.log
          if-no-files-found: ignore
